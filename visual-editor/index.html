<!doctype html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="UTF-8" />
    <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Editor — FolioFold</title>
  <link rel="icon" type="image/png" href="/media/brand/folioframe-icon-256.png" />
  <!-- 品牌字体异步加载：media="print" 不阻塞首屏，拿到后换成 all 才生效。
       原写法在 visual-editor.css 里 @import（渲染阻塞，连不到 Google 时白等约 2 秒，详见 styles.css 头部注释）。 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700&amp;family=Playfair+Display:ital,wght@0,500;0,600;1,500&amp;display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/visual-editor/visual-editor.css?v=20260926r2" />
  <link rel="stylesheet" href="/i18n.css?v=20260927r2" />
  <script>
  /* 多模板：把当前地址里的 ?tpl= 自动附加到本页发出的所有 /api/ 请求上。 */
  (function () {
    var tpl = new URLSearchParams(location.search).get('tpl') || 'main';
    window.__TPL__ = tpl;
    function withTpl(u) {
      if (typeof u !== 'string' || u.indexOf('/api/') !== 0) return u;
      if (/[?&]tpl=/.test(u)) return u;
      return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'tpl=' + encodeURIComponent(tpl);
    }
    window.__apiUrl = withTpl;
    var raw = window.fetch.bind(window);
    window.fetch = function (input, init) {
      if (typeof input === 'string') input = withTpl(input);
      return raw(input, init);
    };
  })();
  </script>
</head>
<body data-ff-locale-scope="editor">
  <div id="ve-app" class="ve-loading">正在加载 Visual Editor…</div>
  <script>
  /* 看门狗：任何原因导致没渲染出来，都会显示明确的错误和自救步骤，而不是永远"正在加载"。 */
  (function () {
    var shown = false;
    function fail(title, detail) {
      if (shown) return; shown = true;
      var el = document.getElementById('ve-app');
      if (!el) return;
      el.className = 've-error';
      el.style.display = 'block';
      el.innerHTML =
        '<div style="max-width:640px;text-align:left">' +
        '<h2 style="margin:0 0 10px;font-size:20px">' + title + '</h2>' +
        '<p style="margin:0 0 12px">请按顺序试这三步（90% 的情况第 1 步就好）：</p>' +
        '<ol style="margin:0 0 14px 20px;padding:0;line-height:1.9">' +
        '<li>看一眼有没有一个黑色命令行窗口标题写着 <code>FolioFold</code>。没有就是服务没开 → 双击 <b>FolioFold 启动.bat</b>。</li>' +
        '<li>服务开着 → 按 <b>Ctrl + Shift + R</b>（强制刷新，绕过缓存）。</li>' +
        '<li>还不行 → 双击 <b>FolioFold 修复.bat</b>（一键修复：重启服务 + 打开页面）。</li>' +
        '</ol>' +
        '<pre style="white-space:pre-wrap;background:#f6f6f6;border:1px solid #ddd;padding:10px;font-size:12px">' + detail + '</pre>' +
        '<button onclick="location.reload()" style="padding:10px 16px;cursor:pointer">重新加载本页</button>' +
        '</div>';
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t !== window && t.tagName) {
        if (t.tagName === 'SCRIPT' || t.tagName === 'LINK') {
          /* ⚠ 只有**本站自己的**脚本/样式挂了才算致命。
             第三方资源连不上是常态（本机系统代理可能是死的、或防火墙拦了）——
             品牌字体（fonts.googleapis.com）加载失败只少一个字体，绝不该把整个界面
             替换成"有个文件没加载成功"的错误页。实测踩过：字体链接失败 → 排版编辑整页被顶掉。 */
          var url = t.src || t.href || '';
          var own = !url || url.indexOf(location.origin) === 0 || url.charAt(0) === '/' || url.charAt(0) === '.';
          if (own) { fail('有个文件没加载成功', url); return; }
          try { console.warn('[FolioFold] 第三方资源没加载出来（不影响使用）：', url); } catch (_) {}
          return;
        }
        // 图片 / 视频 / 音频等资源加载失败不算致命（例如缩略图对应的媒体文件已被删除），
        // 直接忽略，避免整页被错误页顶掉。
        return;
      }
      var msg = (e && e.message) || '';
      var line = (e && e.lineno) || 0;
      if (!msg && !line) { try { console.warn('[FolioFold] 收到信息为空的 error 事件，已忽略'); } catch (_) {} return; }
      fail('页面脚本出错了', msg + '\n' + ((e && e.filename) || '') + ' 第 ' + line + ' 行');
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      fail('数据没取回来', String((e.reason && e.reason.message) || e.reason || ''));
    });
    setTimeout(function () {
      var el = document.getElementById('ve-app');
      if (el && !el.querySelector('.ve-shell') && el.className.indexOf('ve-error') < 0) {
        fail('等了 12 秒还没加载完', '本地服务可能没在跑，或浏览器还在用旧缓存页面。\n（自检地址：http://localhost:3000/api/health）');
      }
    }, 12000);
  })();
  </script>
  <script src="/dist-config.js?v=20261007a1"></script>
<script src="/i18n-zh-en.js?v=20260927r6"></script>
<script src="/i18n.js?v=20261007a1"></script>
  <script src="/editor/themes.js?v=20260925r3"></script>
  <script src="/visual-editor/visual-editor.js?v=20260927r4"></script>
  <script src="/visual-editor/visual-editor-fix.js?v=20260926r7"></script>
</body>
</html>
